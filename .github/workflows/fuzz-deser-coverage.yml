name: Fuzz Deser Coverage

# Ensures every type with a custom wincode schema implementation (a hand-written
# SchemaRead/SchemaWrite impl, or a `#[wincode(with = "...")]` field) is covered
# by the `custom_deser_roundtrip` fuzz harness.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - "**/*.rs"
      - "fuzz/fuzz_targets/custom_deser_roundtrip.rs"
      - "ci/check-fuzz-deser-coverage.py"
      - ".github/workflows/fuzz-deser-coverage.yml"

jobs:
  check:
    name: fuzz deser coverage
    if: github.repository_owner == 'anza-xyz'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Check custom-schema types are fuzzed
        run: python3 ci/check-fuzz-deser-coverage.py
